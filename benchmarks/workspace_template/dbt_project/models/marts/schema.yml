version: 2

models:
  - name: fct_daily_gmv
    description: Daily GMV mart partitioned by order_date.
    columns:
      - name: order_date
        tests:
          - unique
          - not_null
      - name: order_count
        tests:
          - not_null
      - name: net_gmv_usd
        tests:
          - not_null

  - name: dim_user_ltv
    description: Lifetime value dimension per user.
    columns:
      - name: user_id
        tests:
          - unique
          - not_null
      - name: lifetime_orders
        tests:
          - not_null
      - name: lifetime_gmv_usd
        tests:
          - not_null
