[build-system]
requires = ["setuptools>=70.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dataops-harness"
version = "0.1.0"
description = "Runtime Agent Harness for troubleshooting and self-healing heterogeneous PySpark, Delta, and dbt-duckdb data pipelines."
readme = "AGENTS.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pyspark>=3.5.3,<3.6.0",
    "delta-spark>=3.2.0,<3.3.0",
    "deltalake>=0.19.0",
    "dbt-core>=1.8.0,<1.11.0",
    "dbt-duckdb>=1.8.0,<1.10.0",
    "duckdb>=1.1.0",
    "sqlglot>=25.0.0",
    "litellm>=1.50.0",
    "openai>=1.50.0",
    "anthropic>=0.40.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.0",
    "rich>=13.7.0",
    "setuptools>=70.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
include = ["src*", "benchmarks*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
