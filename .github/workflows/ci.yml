name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Cache Spark/Delta Ivy artifacts
        uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ${{ runner.os }}-ivy2-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-ivy2-

      - name: Sync dependencies
        run: uv sync --locked --python 3.12

      - name: Run ruff lint
        run: uv run ruff check src benchmarks tests .agents/skills

      - name: Seed benchmark workspace
        run: uv run python benchmarks/reset_env.py --seed 42 --orders 6000 --users 1000

      - name: Run formal state machine check
        run: uv run python .agents/skills/verify-run-state-machine/scripts/check_run_state_machine.py

      - name: Run pytest suite (excluding 14-scenario full ablation)
        run: uv run pytest -v -k "not all_fourteen"

      - name: Run 14-scenario ablation verification
        run: uv run pytest tests/test_ablation_runner.py -k "all_fourteen" -v
